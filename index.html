<style>
:root{--bg:#08080C;--s1:#121218;--s2:#1b1b24;--bd:#2a2a36;--tx:#fff;--mu:#9b9bb0;--ac:#A8D0FF;--rd:#FF9AA8;--gr:#B5E8C8;--r:12px}

.dl{color:var(--mu);margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#modal .ov{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:4vh 12px}
.md{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:520px}.md.w{max-width:760px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
.fg .f{grid-column:1/-1}

.ld{display:flex;justify-content:center;padding:60px;color:var(--mu)}
.ctr{max-width:420px;margin:8vh auto;padding:20px}.ctr .fg{grid-template-columns:1fr}
.bn{display:none}.hd{display:inline-flex}
@media(max-width:800px){
aside{display:none}.hd{display:none}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.bn button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 0;min-height:48px}.bn button.on{color:var(--ac)}
.bn i,.bn svg{width:22px;height:22px}
main{padding:14px 12px 96px}.top{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.col{flex-basis:84vw}.fg{grid-template-columns:1fr}.md{padding:16px}.btn{min-height:38px}
#toast{bottom:90px}input,select,textarea{font-size:16px}}
html{-webkit-tap-highlight-color:transparent}button,select,input,.card,.chip{touch-action:manipulation}
.k{border-top:3px solid var(--kc,var(--bd))}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}

@media(hover:none){.qs{display:block}}
@media(max-width:800px){
.qs{display:block}.top .btn.p{display:none}
.fab{display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#fff;color:#0b0b10;border:0;align-items:center;justify-content:center;z-index:31;box-shadow:0 6px 22px #000b}
.fab i,.fab svg{width:26px;height:26px}
.chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 14px;padding:0 12px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;padding:9px 16px}
#modal .ov{align-items:flex-end;padding:0}
.md,.md.w{max-width:none;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.md::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--bd);margin:-6px auto 12px}
.sh{top:-18px}.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}.card{padding:12px}.ti .tm{width:42px}
.kp{grid-template-columns:1fr 1fr}.k div{font-size:20px}.qs{flex:1;min-width:0;padding:6px 8px}}
html{color-scheme:dark}
.kan{scrollbar-width:thin;scrollbar-color:#3a3a4a transparent}
.kan::-webkit-scrollbar{height:8px}.kan::-webkit-scrollbar-track{background:transparent}
.kan::-webkit-scrollbar-thumb{background:#2f2f3c;border-radius:99px}.kan::-webkit-scrollbar-thumb:hover{background:#A8D0FF}
@media(max-width:800px){.kan{scrollbar-width:none}.kan::-webkit-scrollbar{display:none}}
.fl{--s:34px;position:relative;width:var(--s);height:var(--s);flex:none}
.fl svg{position:absolute;left:0;bottom:0;width:var(--s);height:var(--s)}
.fy{position:absolute;left:0;bottom:0;width:100%;height:0;overflow:hidden;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.fl.l2,.fl.l3{animation:sway 2.4s ease-in-out infinite;transform-origin:50% 90%}
.fl.l3{filter:drop-shadow(0 0 5px #FFB8D066)}.fl.l4{filter:drop-shadow(0 0 8px #FFE2A0aa);animation:pulse 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{50%{transform:rotate(-4deg) scale(1.05)}}@keyframes pulse{50%{transform:scale(1.1)}}
.fw{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:var(--r);background:var(--s1);cursor:pointer;text-align:left;width:100%}
.fw:hover{border-color:var(--ac)}.fw .tx{flex:1;min-width:0}.fw b{display:block;font-size:13px}.fw small{color:var(--mu);font-size:12px}
.fw .pb{height:4px;border-radius:9px;background:var(--s2);margin-top:7px;overflow:hidden}
.fw .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#A8D0FF,#FFB8D0,#FFE2A0);transition:width .7s}
.fwt{display:none;align-items:center;gap:6px;padding:6px 10px}.fwt .fl{--s:22px}
.md.nf{animation:none}
#cel{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:#08080Cd9;backdrop-filter:blur(4px);animation:fin .3s}
#cel .cb{position:relative;text-align:center;background:var(--s1);border:1px solid var(--bd);border-radius:22px;padding:26px 36px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
#cel .cb .fl{--s:84px;margin:0 auto 8px}
#cel .cb h2{font-size:24px;margin:6px 0 4px;background:linear-gradient(90deg,#A8D0FF,#FFB8D0,#FFE2A0);-webkit-background-clip:text;background-clip:text;color:transparent}
.rg{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid var(--c);opacity:0;animation:ring 1.8s ease-out infinite}
.cf{position:absolute;left:50%;top:50%;width:9px;height:14px;border-radius:3px;background:var(--c);opacity:0;animation:burst 1.7s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes ring{0%{transform:scale(.4);opacity:.8}100%{transform:scale(14);opacity:0}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 120px)) rotate(var(--r));opacity:0}}
@keyframes fin{from{opacity:0}}@keyframes pop{from{transform:scale(.7);opacity:0}}
@media(max-width:800px){.fwt{display:inline-flex}}
@media(prefers-reduced-motion:reduce){.rg,.cf{display:none}.fl{animation:none!important}.fy{transition:none}}
.pg{height:8px;background:var(--s2);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,#A8D0FF,#B5E8C8,#FFE2A0);transition:width .7s}.k .sm2{display:block;margin-top:2px}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="3"><stop offset="0" stop-color="#A8D0FF"/><stop offset=".4" stop-color="#CDBFFF"/><stop offset=".7" stop-color="#FFB8D0"/><stop offset="1" stop-color="#FFE2A0"/></linearGradient></defs></svg><div id="app"><div class="ld">Carregando…</div></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO SUPABASE (opcional: preencha aqui ou use a tela inicial) ===== */
const CFG={url:'',key:''}; // use somente a chave anon/publishable. NUNCA a service_role.
/* ================================================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const n0=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const icons=()=>window.lucide&&lucide.createIcons();
const ic=n=>`<i data-lucide="${n}"></i>`;
const S=[['novo','Novo lead'],['contato','Contato enviado'],['proposta','Proposta enviada'],['followup','Follow-up'],['aceita','Proposta aceita'],['entrada','Entrada recebida'],['agendado','Contato agendado'],['entregue','Entrega concluída'],['perdido','Lead perdido']];
const SN=Object.fromEntries(S);
const AT={mensagem:'Mensagem enviada',ligacao:'Ligação',proposta:'Proposta',reuniao:'Reunião',followup:'Follow-up',observacao:'Observação'};
const OT={proprio:'Próprio',sdr:'SDR',parceiro:'Parceiro'};
const PAL=['#A8D0FF','#FFB8D0','#B5E8C8','#CDBFFF','#FFE2A0'];
const SC={novo:PAL[0],contato:PAL[3],proposta:PAL[4],followup:PAL[1],aceita:PAL[2],entrada:'#A6EBDC',agendado:'#FFD1B3',entregue:'#8FD9B0',perdido:'#7b7b8c'};
const OC={proprio:PAL[2],sdr:PAL[0],parceiro:PAL[4]};
const tg=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%5;const c=PAL[h];return`<span class="tg" style="background:${c}26;color:${c}">${esc(t)}</span>`};
const NAV=[['dashboard','layout-dashboard','Dashboard'],['agenda','calendar-clock','Agenda'],['kanban','kanban','Kanban'],['arquivados','archive','Arquivados'],['config','settings','Config']];
const st={leads:[],acts:[],recs:[],view:localStorage.p7dv||'dashboard',ag:'todos',kf:'todas'};
let sb=null,user=null;
const L=id=>st.leads.find(x=>x.id==id);
const act=()=>st.leads.filter(l=>!l.archived);
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dayKey(new Date());
const fT=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fD=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
const fDT=d=>d?fD(d)+' '+fT(d):'—';
const fDay=s=>s?fD(s+'T12:00'):'—';
const loc=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const daysIn=l=>Math.max(0,Math.floor((Date.now()-new Date(l.stage_changed_at))/864e5))+'d na etapa';
function toast(m,e){const t=document.createElement('div');t.textContent=m;if(e)t.className='er';$('#toast').appendChild(t);setTimeout(()=>t.remove(),e?5000:2200)}
async function q(p){const{data,error}=await p;if(error){toast(error.message,1);throw error}return data}
const POST=['aceita','entrada','agendado','entregue'];
const recOf=id=>st.recs.filter(r=>r.lead_id==id);
const recvd=id=>recOf(id).reduce((t,r)=>t+Number(r.amount||0),0);
const pend=l=>Math.max(0,Number(l.commission_value||0)-recvd(l.id));
function waLink(p){let n=String(p||'').replace(/\D/g,'');if(!n)return null;if(!(n.startsWith('55')&&n.length>=12))n='55'+n;return'https://wa.me/'+n}
function wa(id){const l=L(id),u=waLink(l&&l.phone);if(!u)return toast('Cadastre o telefone deste lead para abrir o WhatsApp.',1);window.open(u,'_blank','noopener')}

/* ---------- INIT / AUTH ---------- */
async function init(){
  const url=CFG.url||localStorage.p7url,key=CFG.key||localStorage.p7key;
  if(!url||!key)return setupScreen();
  try{sb=supabase.createClient(url,key)}catch(e){return setupScreen('Configuração inválida.')}
  const{data}=await sb.auth.getSession();
  if(!data.session)return authScreen();
  user=data.session.user;shell();await boot();
}
async function boot(){$('#main').innerHTML='<div class="ld">Carregando dados…</div>';try{await load()}catch(e){$('#main').innerHTML='<div class="ld">Erro ao carregar. Verifique se o SQL foi executado e tente sincronizar novamente nas Configurações.</div>'}}
function setupScreen(msg){$('#app').innerHTML=`<div class="ctr"><div class="brand">Pod7 <b>Sales</b></div><h2>Conectar ao Supabase</h2><p class="mu" style="margin-bottom:12px">${msg||'Informe a URL do projeto e a chave pública (anon/publishable). Nunca use a service_role.'}</p><form class="fg" data-f="setup"><label>URL do projeto<input name="url" placeholder="https://xxxx.supabase.co" required></label><label>Chave anon/publishable<input name="key" required></label><button class="btn p" type="submit">Salvar e continuar</button></form></div>`}
function authScreen(){$('#app').innerHTML=`<div class="ctr"><div class="brand">Pod7 <b>Sales</b></div><h2>Entrar</h2><form class="fg" data-f="auth"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" minlength="6" required></label><button class="btn p" type="submit">Entrar</button><button class="btn" type="button" data-a="signup">Criar conta (primeiro acesso)</button></form></div>`}
function shell(){
  $('#app').innerHTML=`<aside><div class="brand">Pod7 <b>Sales</b></div>${NAV.map(n=>`<button class="nv" data-nav="${n[0]}" data-a="nav" data-v="${n[0]}">${ic(n[1])}${n[2]}</button>`).join('')}<button type="button" class="fw" id="fw" data-a="fila">${flame()}<div class="tx"><b id="fw-t"></b><small id="fw-s"></small><div class="pb"><i id="fw-b"></i></div></div></button></aside>
  <div class="mn"><header class="top"><div class="sb">${ic('search')}<input id="q" placeholder="Buscar nome, empresa, cidade, profissão, tag…" autocomplete="off"><div id="sr" hidden></div></div><button class="btn fwt" id="fwt" data-a="fila" aria-label="Fila do dia">${flame()}<span id="fwt-t"></span></button>
  <button class="btn ib hd" title="Dashboard" data-a="nav" data-v="dashboard">${ic('layout-dashboard')}</button><button class="btn ib hd" title="Arquivados" data-a="nav" data-v="arquivados">${ic('archive')}</button><button class="btn ib hd" title="Configurações" data-a="nav" data-v="config">${ic('settings')}</button>
  <button class="btn p" data-a="newLead">${ic('plus')}<span class="hd">Novo lead</span></button></header><main id="main"></main></div>
  <nav class="bn">${NAV.map(n=>`<button data-nav="${n[0]}" data-a="nav" data-v="${n[0]}">${ic(n[1])}${n[2]}</button>`).join('')}</nav><button class="fab" data-a="newLead" aria-label="Novo lead">${ic('plus')}</button>`;
  document.body.classList.toggle('cp',localStorage.p7c=='1');icons();
}
async function load(){
  const[l,a,r]=await Promise.all([q(sb.from('leads').select('*').order('created_at',{ascending:false})),q(sb.from('lead_activities').select('*').order('created_at',{ascending:false})),q(sb.from('receipts').select('*').order('received_at',{ascending:false}))]);
  st.leads=l;st.acts=a;st.recs=r;render();
}
function render(){
  if(!$('#main'))return;
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav==st.view));
  const k0=$('.kan'),sx=k0?k0.scrollLeft:0,sy=window.scrollY;

function filaPanel(){
  const f=filaData();
  const row=l=>`<div class="rw" style="flex-wrap:wrap;align-items:center"><div style="min-width:0"><b>${esc(l.name)}</b> <span class="mu">${esc(l.company)}</span><div class="sm2">${SN[l.stage]} · comissão ${brl(l.commission_value)} · ${daysIn(l)}</div></div><div class="row"><button class="btn sm g" data-a="wa" data-id="${l.id}">${ic('message-circle')}WhatsApp</button><button class="btn sm" data-a="open" data-id="${l.id}">Abrir</button><button class="btn sm p" data-a="sendprop" data-id="${l.id}">Proposta enviada</button></div></div>`;
  const msg=f.q.length?f.done+' de '+f.total+' leads com proposta enviada hoje':f.total?'Fila zerada! '+f.done+' proposta(s) enviada(s) hoje · '+brl(f.val)+' em comissão':'Nenhum lead na fila.';
  modal(`<div class="rw sh" style="border:0"><h2 style="margin:0">Fila do dia</h2><button class="btn ib" data-a="mclose">${ic('x')}</button></div><p class="mu" style="margin:6px 0 12px">${msg}</p>${f.q.map(row).join('')}${f.sent.length?`<div class="dl">Enviadas hoje</div>${f.sent.map(l=>`<div class="rw"><span>${esc(l.name)}</span><span class="mu">${brl(l.commission_value)}</span></div>`).join('')}`:''}`,0,1);
}
function celebrate(f){
  const el=document.createElement('div');el.id='cel';let h='';
  for(let i=0;i<3;i++)h+=`<i class="rg" style="--c:${PAL[(i*2)%5]};animation-delay:${i*.25}s"></i>`;
  for(let i=0;i<40;i++){const a=Math.random()*6.28,d=110+Math.random()*190;h+=`<b class="cf" style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-40}px;--c:${PAL[i%5]};--r:${Math.random()*540-270}deg;animation-delay:${Math.random()*.25}s"></b>`}
  el.innerHTML=h+`<div class="cb">${flame('l4')}<h2>Fila zerada!</h2><p>${f.done} proposta${f.done>1?'s':''} enviada${f.done>1?'s':''} · ${brl(f.val)} em comissão</p><small class="mu">Toque para fechar</small></div>`;
  el.onclick=()=>el.remove();document.body.appendChild(el);void el.offsetWidth;
  el.querySelector('.fy').style.height='88%';setTimeout(()=>el.remove(),4800);
}
/* ---------- DATA OPS ---------- */
async function addAct(lead_id,o){const at=o.at?new Date(o.at).toISOString():null;return q(sb.from('lead_activities').insert({lead_id,type:o.type||'observacao',content:o.content||'',scheduled_at:at,done:!at,done_at:at?null:new Date().toISOString()}).select().single())}
async function syncNext(id){const p=(await q(sb.from('lead_activities').select('*').eq('lead_id',id).eq('done',false).not('scheduled_at','is',null).order('scheduled_at').limit(1)))[0];await q(sb.from('leads').update({next_action:p?(p.content||AT[p.type]):'',next_action_at:p?p.scheduled_at:null}).eq('id',id))}
async function moveLead(id,stage){
  const l=L(id);if(!l||l.stage==stage)return;
  const prev={stage:l.stage,stage_changed_at:l.stage_changed_at,proposal_sent_at:l.proposal_sent_at},txt='Etapa alterada: '+SN[l.stage]+' → '+SN[stage];
  const open=()=>{if(!$('#modal .md'))return;st.keep=1;try{st.panel?filaPanel():detail(id)}finally{st.keep=0}};
  l.stage=stage;l.stage_changed_at=new Date().toISOString();
  if(PSG.includes(stage)&&!l.proposal_sent_at)l.proposal_sent_at=l.stage_changed_at;
  if(stage=='novo'||stage=='contato')l.proposal_sent_at=null;
  render();open();
  try{await q(sb.from('leads').update({stage}).eq('id',id));const a=await addAct(id,{type:'observacao',content:txt});st.acts.unshift(a);open()}
  catch(e){Object.assign(l,prev);render();open()}
}
const forms={
  async setup(d){localStorage.p7url=d.url.trim();localStorage.p7key=d.key.trim();location.reload()},
  async auth(d){const{error}=await sb.auth.signInWithPassword({email:d.email,password:d.password});if(error)return toast(error.message,1);location.reload()},
  async lead(d,ds){
    const p={name:d.name.trim(),phone:d.phone,email:d.email,profession:d.profession,city:d.city,origin:d.origin,origin_type:d.origin_type,partner_name:d.partner_name,tags:d.tags.split(',').map(x=>x.trim()).filter(Boolean),stage:d.stage,proposal_value:Number(d.proposal_value)||0,commission_value:Number(d.commission_value)||0,notes:d.notes};
    const old=ds.id?L(ds.id):null;
    const row=ds.id?await q(sb.from('leads').update(p).eq('id',ds.id).select().single()):await q(sb.from('leads').insert(p).select().single());
    if(Number(d.rec_value)>0)await q(sb.from('receipts').insert({lead_id:row.id,amount:Number(d.rec_value),received_at:d.rec_date||today()}));
    if(d.next_action_at&&(!old||!old.next_action_at||new Date(old.next_action_at).getTime()!=new Date(d.next_action_at).getTime())){await addAct(row.id,{type:'followup',content:d.next_action,at:d.next_action_at});await syncNext(row.id)}
    closeM();await load();toast('Lead salvo')
  },
  async act(d,ds){await addAct(ds.id,d);if(d.at)await syncNext(ds.id);await load();detail(ds.id);toast('Atividade registrada')},
  async sched(d,ds){await addAct(ds.id,d);await syncNext(ds.id);closeM();await load();toast('Retorno agendado')},
  async complete(d,ds){
    const a=st.acts.find(x=>x.id==ds.id);
    await q(sb.from('lead_activities').update({done:true,done_at:new Date().toISOString(),result:d.result}).eq('id',ds.id));
    if(d.next_at)await addAct(a.lead_id,{type:d.type,content:d.content,at:d.next_at});
    await syncNext(a.lead_id);closeM();await load();toast('Atividade concluída')
  },
  async rec(d,ds){
    if(!(Number(d.amount)>0))return toast('Informe o valor recebido.',1);
    await q(sb.from('receipts').insert({lead_id:ds.id,amount:Number(d.amount),received_at:d.received_at||today()}));
    await load();detail(ds.id);toast('Recebimento registrado')
  }
};
const A={
  nav(t){st.view=t.v;closeM();render();scrollTo(0,0)},
  fila(){filaPanel()},sendprop(t){moveLead(t.id,'proposta')},ag(t){st.ag=t.v;render()},kf(t){st.kf=t.v;render()},
  newLead(t){leadForm(null,t.s)},open(t){$('#sr').hidden=true;$('#q').value='';detail(t.id)},edit(t){leadForm(t.id)},
  wa(t){wa(t.id)},sched(t){schedForm(t.id)},done(t){doneForm(t.id)},
  mclose(d,e,el){if(e.target===el||el.tagName=='BUTTON')closeM()},
  async arch(t){await q(sb.from('leads').update({archived:true,archived_at:new Date().toISOString()}).eq('id',t.id));closeM();await load();toast('Lead arquivado')},
  async restore(t){await q(sb.from('leads').update({archived:false,archived_at:null}).eq('id',t.id));closeM();await load();toast('Lead restaurado')},
  async del(t){if(!confirm('Excluir definitivamente este lead, seu histórico e suas vendas? Não pode ser desfeito.'))return;await q(sb.from('leads').delete().eq('id',t.id));closeM();await load();toast('Lead excluído')},
  async delrec(t){if(!confirm('Excluir este recebimento?'))return;await q(sb.from('receipts').delete().eq('id',t.id));await load();detail(t.l);toast('Recebimento excluído')},
  async signup(){const f=document.querySelector('[data-f=auth]'),d=Object.fromEntries(new FormData(f));if(!d.email||!d.password)return toast('Preencha e-mail e senha.',1);const{data,error}=await sb.auth.signUp({email:d.email,password:d.password});if(error)return toast(error.message,1);if(data.session)location.reload();else toast('Conta criada. Confirme o e-mail (se exigido) e entre.')},
  async out(){if(confirm('Sair da conta?')){await sb.auth.signOut();location.reload()}},
  resetcfg(){if(confirm('Remover a conexão salva neste navegador?')){localStorage.removeItem('p7url');localStorage.removeItem('p7key');location.reload()}},
  async sync(){await boot();toast('Sincronizado')}
};
document.addEventListener('click',async e=>{if(e.target.closest('select,input,textarea'))return;const t=e.target.closest('[data-a]');if(!t)return;try{await A[t.dataset.a]?.(t.dataset,e,t)}catch(x){console.error(x)}
  if(!e.target.closest('.sb'))$('#sr')&&($('#sr').hidden=true)});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=f.querySelector('[type=submit]');if(b)b.disabled=true;try{await forms[f.dataset.f](Object.fromEntries(new FormData(f)),f.dataset)}catch(x){console.error(x)}finally{if(b)b.disabled=false}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.ch;
  if(c=='stage'||c=='cs')moveLead(t.dataset.id,t.value);
  if(c=='compact'){localStorage.p7c=t.checked?'1':'0';document.body.classList.toggle('cp',t.checked)}
  if(c=='dv')localStorage.p7dv=t.value;});
document.addEventListener('input',e=>{if(e.target.id!='q')return;const v=e.target.value.toLowerCase().trim(),r=$('#sr');if(!v){r.hidden=true;return}
  const m=st.leads.filter(l=>[l.name,l.company,l.city,l.profession,(l.tags||[]).join(' ')].join(' ').toLowerCase().includes(v)).slice(0,8);
  r.innerHTML=m.map(l=>`<div data-a="open" data-id="${l.id}"><b>${esc(l.name)}</b> <span class="mu">${esc(l.company)} ${l.archived?'(arquivado)':'· '+SN[l.stage]}</span></div>`).join('')||'<div class="mu">Nada encontrado</div>';r.hidden=false});
/* Drag and drop (desktop) */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){dragId=c.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c&&dragId){e.preventDefault();if(!c.classList.contains('ov2')){document.querySelectorAll('.col.ov2').forEach(x=>x.classList.remove('ov2'));c.classList.add('ov2')}}});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');document.querySelectorAll('.col').forEach(x=>x.classList.remove('ov2'));if(c&&dragId){e.preventDefault();moveLead(dragId,c.dataset.col)}dragId=null});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col').forEach(x=>x.classList.remove('ov2'))});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sb&&user&&!$('#modal .md'))load().catch(()=>{})});
init();
</script></body></html>
