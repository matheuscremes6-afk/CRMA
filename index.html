<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080C"><title>Pod7 Sales</title>
<style>
:root{--bg:#08080C;--s1:#121218;--s2:#1b1b24;--bd:#2a2a36;--tx:#fff;--mu:#9b9bb0;--ac:#A99AF5;--rd:#ff6b6b;--gr:#5fd39a;--r:12px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body.cp{font-size:13px}body.cp .card,body.cp .ti .tb{padding:7px 9px}
button,input,select,textarea{font:inherit;color:inherit}
i[data-lucide],svg.lucide{width:16px;height:16px;vertical-align:-3px}
.mu{color:var(--mu)}.ac{color:var(--ac)}.rd{color:var(--rd)}
#app{display:flex;min-height:100vh}
aside{width:210px;flex:none;border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;padding:4px 10px 16px}.brand b{color:var(--ac)}
.nv{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:9px;color:var(--mu);cursor:pointer;text-align:left}
.nv:hover{background:var(--s1)}.nv.on{background:var(--s2);color:var(--tx)}.nv.on i,.nv.on svg{color:var(--ac)}
.mn{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(8,8,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;padding:10px 22px}
.sb{position:relative;flex:1;max-width:520px}
.sb input{width:100%;padding:9px 12px 9px 34px}.sb>i,.sb>svg{position:absolute;left:11px;top:11px;color:var(--mu)}
#sr{position:absolute;top:44px;left:0;right:0;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 30px #000a}
#sr>div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--bd)}#sr>div:hover{background:var(--s2)}
main{padding:22px;max-width:1500px}
h1{font-size:22px;margin-bottom:14px}h2{font-size:16px;margin-bottom:10px}
input,select,textarea{background:var(--s1);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.btn{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;width:auto}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);color:#0b0b10;border-color:var(--ac);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}.btn.g{color:var(--gr)}.btn.d{color:var(--rd)}
.ib{width:38px;padding:8px;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--s1);border:1px solid var(--bd);border-radius:99px;padding:5px 13px;cursor:pointer;color:var(--mu)}
.chip.on{border-color:var(--ac);color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px}.k small{color:var(--mu)}.k div{font-size:24px;font-weight:700;margin-top:4px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pn{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11px;color:var(--mu)}
.bars i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 0 0;min-height:2px}
.rw{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.kan{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px;scroll-snap-type:x proximity}
.col{flex:0 0 275px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:10px;scroll-snap-align:start;min-height:120px}
.col.ov2{border-color:var(--ac)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}.ch b{font-size:13px}
.card{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card.pri{border-left:3px solid var(--ac)}
.card .t{font-weight:600}.sm2{font-size:12px;color:var(--mu)}
.tg{display:inline-block;background:#A99AF51f;color:var(--ac);border-radius:6px;padding:1px 7px;font-size:11px;margin:0 3px 2px 0}
.bd2{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--mu)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ti{display:flex;gap:12px;margin-bottom:10px}
.ti .tm{width:48px;flex:none;color:var(--ac);font-weight:600;padding-top:10px}
.ti .tb{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.ti.late .tb{border-color:var(--rd);background:#ff6b6b12}.ti.late .tm{color:var(--rd)}.ti.dn .tb{opacity:.55}
.dl{color:var(--mu);margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#modal .ov{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:4vh 12px}
.md{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:20px;width:100%;max-width:520px}.md.w{max-width:760px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
.fg .f{grid-column:1/-1}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:var(--s2);border:1px solid var(--ac);padding:9px 16px;border-radius:10px}#toast .er{border-color:var(--rd)}
.ld{display:flex;justify-content:center;padding:60px;color:var(--mu)}
.ctr{max-width:420px;margin:8vh auto;padding:20px}.ctr .fg{grid-template-columns:1fr}
.bn{display:none}.hd{display:inline-flex}
@media(max-width:800px){
aside{display:none}.hd{display:none}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.bn button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 0;min-height:48px}.bn button.on{color:var(--ac)}
.bn i,.bn svg{width:22px;height:22px}
main{padding:14px 12px 96px}.top{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.col{flex-basis:84vw}.fg{grid-template-columns:1fr}.md{padding:16px}.btn{min-height:38px}
#toast{bottom:90px}input,select,textarea{font-size:16px}}
</style></head><body>
<div id="app"><div class="ld">Carregando…</div></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO SUPABASE (opcional: preencha aqui ou use a tela inicial) ===== */
const CFG={url:'',key:''}; // use somente a chave anon/publishable. NUNCA a service_role.
/* ================================================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const n0=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const icons=()=>window.lucide&&lucide.createIcons();
const ic=n=>`<i data-lucide="${n}"></i>`;
const S=[['novo','Novo lead'],['contato','Contato enviado'],['proposta','Proposta enviada'],['followup','Follow-up'],['aceita','Proposta aceita'],['entrada','Entrada recebida'],['agendado','Contato agendado'],['entregue','Entrega concluída'],['perdido','Lead perdido']];
const SN=Object.fromEntries(S);
const AT={mensagem:'Mensagem enviada',ligacao:'Ligação',proposta:'Proposta',reuniao:'Reunião',followup:'Follow-up',observacao:'Observação'};
const MD={override:'Override',propria:'Venda própria',collab:'Collab',closer:'Closer associado'};
const RULES={override:{o:500,m:100,s:0,ol:'Vendedor'},propria:{o:0,m:600,s:0},collab:{o:300,m:300,s:0,ol:'Vendedor/parceiro'},closer:{o:250,m:250,s:100,ol:'Closer'}};
const OT={proprio:'Próprio',sdr:'SDR',parceiro:'Parceiro'};
const NAV=[['dashboard','layout-dashboard','Dashboard'],['agenda','calendar-clock','Agenda'],['kanban','kanban','Kanban'],['arquivados','archive','Arquivados'],['config','settings','Config']];
const st={leads:[],acts:[],sales:[],view:localStorage.p7dv||'dashboard',ag:'todos',kf:'todas'};
let sb=null,user=null;
const L=id=>st.leads.find(x=>x.id==id);
const act=()=>st.leads.filter(l=>!l.archived);
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dayKey(new Date());
const fT=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fD=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
const fDT=d=>d?fD(d)+' '+fT(d):'—';
const fDay=s=>s?fD(s+'T12:00'):'—';
const loc=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const daysIn=l=>Math.max(0,Math.floor((Date.now()-new Date(l.stage_changed_at))/864e5))+'d na etapa';
function toast(m,e){const t=document.createElement('div');t.textContent=m;if(e)t.className='er';$('#toast').appendChild(t);setTimeout(()=>t.remove(),e?5000:2200)}
async function q(p){const{data,error}=await p;if(error){toast(error.message,1);throw error}return data}
const saleOf=id=>st.sales.find(s=>s.lead_id==id);
function waLink(p){let n=String(p||'').replace(/\D/g,'');if(!n)return null;if(!(n.startsWith('55')&&n.length>=12))n='55'+n;return'https://wa.me/'+n}
function wa(id){const l=L(id),u=waLink(l&&l.phone);if(!u)return toast('Cadastre o telefone deste lead para abrir o WhatsApp.',1);window.open(u,'_blank','noopener')}

/* ---------- INIT / AUTH ---------- */
async function init(){
  const url=CFG.url||localStorage.p7url,key=CFG.key||localStorage.p7key;
  if(!url||!key)return setupScreen();
  try{sb=supabase.createClient(url,key)}catch(e){return setupScreen('Configuração inválida.')}
  const{data}=await sb.auth.getSession();
  if(!data.session)return authScreen();
  user=data.session.user;shell();await boot();
}
async function boot(){$('#main').innerHTML='<div class="ld">Carregando dados…</div>';try{await load()}catch(e){$('#main').innerHTML='<div class="ld">Erro ao carregar. Verifique se o SQL foi executado e tente sincronizar novamente nas Configurações.</div>'}}
function setupScreen(msg){$('#app').innerHTML=`<div class="ctr"><div class="brand">Pod7 <b>Sales</b></div><h2>Conectar ao Supabase</h2><p class="mu" style="margin-bottom:12px">${msg||'Informe a URL do projeto e a chave pública (anon/publishable). Nunca use a service_role.'}</p><form class="fg" data-f="setup"><label>URL do projeto<input name="url" placeholder="https://xxxx.supabase.co" required></label><label>Chave anon/publishable<input name="key" required></label><button class="btn p" type="submit">Salvar e continuar</button></form></div>`}
function authScreen(){$('#app').innerHTML=`<div class="ctr"><div class="brand">Pod7 <b>Sales</b></div><h2>Entrar</h2><form class="fg" data-f="auth"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" minlength="6" required></label><button class="btn p" type="submit">Entrar</button><button class="btn" type="button" data-a="signup">Criar conta (primeiro acesso)</button></form></div>`}
function shell(){
  $('#app').innerHTML=`<aside><div class="brand">Pod7 <b>Sales</b></div>${NAV.map(n=>`<button class="nv" data-nav="${n[0]}" data-a="nav" data-v="${n[0]}">${ic(n[1])}${n[2]}</button>`).join('')}</aside>
  <div class="mn"><header class="top"><div class="sb">${ic('search')}<input id="q" placeholder="Buscar nome, empresa, cidade, profissão, tag…" autocomplete="off"><div id="sr" hidden></div></div>
  <button class="btn ib hd" title="Dashboard" data-a="nav" data-v="dashboard">${ic('layout-dashboard')}</button><button class="btn ib hd" title="Arquivados" data-a="nav" data-v="arquivados">${ic('archive')}</button><button class="btn ib hd" title="Configurações" data-a="nav" data-v="config">${ic('settings')}</button>
  <button class="btn p" data-a="newLead">${ic('plus')}<span class="hd">Novo lead</span></button></header><main id="main"></main></div>
  <nav class="bn">${NAV.map(n=>`<button data-nav="${n[0]}" data-a="nav" data-v="${n[0]}">${ic(n[1])}${n[2]}</button>`).join('')}</nav>`;
  document.body.classList.toggle('cp',localStorage.p7c=='1');icons();
}
async function load(){
  const[l,a,s]=await Promise.all([q(sb.from('leads').select('*').order('created_at',{ascending:false})),q(sb.from('lead_activities').select('*').order('created_at',{ascending:false})),q(sb.from('sales').select('*').order('sale_date',{ascending:false}))]);
  st.leads=l;st.acts=a;st.sales=s;render();
}
function render(){
  if(!$('#main'))return;
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav==st.view));
  $('#main').innerHTML=({dashboard:vDash,agenda:vAg,kanban:vKan,arquivados:vArq,config:vCfg})[st.view]();icons();
}

/* ---------- VIEWS ---------- */
const bars=a=>{const mx=Math.max(1,...a.map(x=>x[1]));return`<div class="bars">${a.map(([l,v])=>`<div title="${brl(v)}"><span>${n0(v)}</span><i style="height:${v/mx*78}%"></i><em style="font-style:normal">${l}</em></div>`).join('')}</div>`};
const recSum=f=>st.sales.filter(s=>s.received_date&&f(s)).reduce((t,s)=>t+Number(s.received_value||0),0);
function vDash(){
  const A=act(),now=new Date(),mk=dayKey(now).slice(0,7);
  const late=st.acts.filter(a=>!a.done&&a.scheduled_at&&new Date(a.scheduled_at)<now&&L(a.lead_id)&&!L(a.lead_id).archived).length;
  const acc=A.filter(l=>['aceita','entrada','entregue'].includes(l.stage)).length;
  const pipe=A.filter(l=>['novo','contato','proposta','followup','agendado'].includes(l.stage)).reduce((s,l)=>s+Number(l.proposal_value||0),0);
  const mon=new Date(now);mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const wk=[3,2,1,0].map(i=>{const a=new Date(mon);a.setDate(a.getDate()-7*i);const b=new Date(a);b.setDate(b.getDate()+7);return['Sem '+fD(a),recSum(s=>{const d=new Date(s.received_date+'T12:00');return d>=a&&d<b})]});
  const mo=[5,4,3,2,1,0].map(i=>{const d=new Date(now.getFullYear(),now.getMonth()-i,1),k=dayKey(d).slice(0,7);return[d.toLocaleDateString('pt-BR',{month:'short'}),recSum(s=>s.received_date.slice(0,7)==k)]});
  const ms=st.sales.filter(s=>s.sale_date&&s.sale_date.slice(0,7)==mk);
  const by=Object.keys(MD).map(m=>{const x=ms.filter(s=>s.model==m);return[MD[m],x.length,x.reduce((t,s)=>t+Number(s.my_commission||0),0)]});
  return`<h1>Dashboard</h1><div class="kp">
  <div class="k"><small>Leads ativos</small><div>${A.filter(l=>!['perdido','entregue'].includes(l.stage)).length}</div></div>
  <div class="k"><small>Follow-ups atrasados</small><div class="${late?'rd':''}">${late}</div></div>
  <div class="k"><small>Propostas aceitas</small><div>${acc}</div></div>
  <div class="k"><small>Recebido no mês</small><div class="ac">${brl(recSum(s=>s.received_date.slice(0,7)==mk))}</div></div>
  <div class="k"><small>Pipeline estimado</small><div>${brl(pipe)}</div></div></div>
  <div class="g2"><div class="pn"><h2>Recebimentos por semana</h2>${bars(wk)}</div>
  <div class="pn"><h2>Evolução (recebido por mês)</h2>${bars(mo)}</div>
  <div class="pn"><h2>Vendas no mês: ${ms.length}</h2><p class="mu" style="margin-bottom:6px">Minha comissão por modalidade</p>${by.map(b=>`<div class="rw"><span>${b[0]} <span class="mu">(${b[1]})</span></span><b>${brl(b[2])}</b></div>`).join('')}<div class="rw"><span>Total</span><b class="ac">${brl(by.reduce((t,b)=>t+b[2],0))}</b></div></div></div>`;
}
function vAg(){
  const now=new Date(),td=today(),f=st.ag,P=a=>!a.done,isL=a=>P(a)&&new Date(a.scheduled_at)<now;
  const F={todos:a=>P(a)||(a.done_at&&dayKey(a.done_at)==td),hoje:a=>dayKey(a.scheduled_at)==td,atrasados:isL,followup:a=>a.type=='followup'&&P(a),aceitos:a=>['aceita','entrada'].includes(L(a.lead_id).stage)&&P(a),agendados:a=>P(a)&&new Date(a.scheduled_at)>=now};
  const it=st.acts.filter(a=>a.scheduled_at&&L(a.lead_id)&&!L(a.lead_id).archived&&F[f](a)).sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at));
  const tm=new Date();tm.setDate(tm.getDate()+1);let cur='',h='';
  it.forEach(a=>{const k=dayKey(a.scheduled_at),l=L(a.lead_id);
    if(k!=cur){cur=k;h+=`<div class="dl">${k==td?'Hoje':k==dayKey(tm)?'Amanhã':fD(a.scheduled_at)}</div>`}
    h+=`<div class="ti ${isL(a)?'late':''} ${a.done?'dn':''}"><div class="tm">${fT(a.scheduled_at)}</div><div class="tb"><b>${esc(l.name)}</b> <span class="mu">${esc(l.company)}</span><div class="sm2">${AT[a.type]} · ${SN[l.stage]} · ${a.done?'Concluída':isL(a)?'Atrasada':'Pendente'}</div>${a.content?`<div>${esc(a.content)}</div>`:''}
    <div class="row">${a.done?'':`<button class="btn sm g" data-a="done" data-id="${a.id}">${ic('check')}Concluir</button>`}<button class="btn sm" data-a="open" data-id="${l.id}">Abrir lead</button><button class="btn sm" data-a="wa" data-id="${l.id}">${ic('message-circle')}WhatsApp</button><button class="btn sm" data-a="sched" data-id="${l.id}">${ic('clock')}Agendar retorno</button></div></div></div>`});
  const ch=[['todos','Todos'],['hoje','Hoje'],['atrasados','Atrasados'],['followup','Follow-up'],['aceitos','Aceitos'],['agendados','Agendados']];
  return`<h1>Agenda comercial</h1><div class="chips">${ch.map(c=>`<button class="chip ${f==c[0]?'on':''}" data-a="ag" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>${h||'<p class="mu">Nenhuma atividade neste filtro.</p>'}`;
}
function card(l){
  const s=saleOf(l.id);
  return`<div class="card ${l.origin_type!='parceiro'?'pri':''}" draggable="true" data-id="${l.id}" data-a="open"><div class="t">${esc(l.name)}</div>
  ${l.company?`<div class="sm2">${esc(l.company)}</div>`:''}<div class="sm2">${esc([l.profession,l.city].filter(Boolean).join(' · '))}</div>
  <div>${(l.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div>
  <div class="row"><b class="ac">${brl(l.proposal_value)}</b><span class="bd2">${OT[l.origin_type]}${l.origin?' · '+esc(l.origin):''}</span>${s?`<span class="bd2">${MD[s.model]}</span>`:''}</div>
  <div class="sm2">${daysIn(l)}${l.next_action_at?' · próx.: '+fDT(l.next_action_at):''}</div>
  <div class="row"><button class="btn sm g" data-a="wa" data-id="${l.id}">${ic('message-circle')}WhatsApp</button></div></div>`;
}
function vKan(){
  const f=st.kf,F={todas:()=>1,proprias:l=>l.origin_type=='proprio',sdr:l=>l.origin_type=='sdr',collabs:l=>l.origin_type=='parceiro',closer:l=>st.sales.some(s=>s.lead_id==l.id&&s.model=='closer')};
  const A=act().filter(F[f]),pr=l=>l.origin_type=='parceiro'?1:0;
  const ch=[['todas','Todas'],['proprias','Vendas próprias'],['sdr','Leads de SDR'],['collabs','Collabs'],['closer','Closer associado']];
  return`<h1>Funil comercial</h1><div class="chips">${ch.map(c=>`<button class="chip ${f==c[0]?'on':''}" data-a="kf" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="kan">${S.map(([k,n])=>{const c=A.filter(l=>l.stage==k).sort((a,b)=>pr(a)-pr(b));return`<div class="col" data-col="${k}"><div class="ch"><b>${n} <span class="mu">${c.length}</span></b><span class="sm2">${brl(c.reduce((t,l)=>t+Number(l.proposal_value||0),0))}</span><button class="btn sm ib" style="width:30px" title="Adicionar lead" data-a="newLead" data-s="${k}">${ic('plus')}</button></div>${c.map(card).join('')}</div>`}).join('')}</div>
  <p class="sm2">Arraste os cartões entre colunas (desktop). No celular, abra o lead e mude a etapa.</p>`;
}
function vArq(){
  const A=st.leads.filter(l=>l.archived);
  return`<h1>Arquivados</h1>${A.length?A.map(l=>`<div class="pn" style="margin-bottom:8px"><div class="rw" style="border:0"><div><b>${esc(l.name)}</b> <span class="mu">${esc(l.company)}</span><div class="sm2">${SN[l.stage]} · ${brl(l.proposal_value)}</div></div><div class="row"><button class="btn sm" data-a="open" data-id="${l.id}">Consultar</button><button class="btn sm g" data-a="restore" data-id="${l.id}">${ic('rotate-ccw')}Restaurar</button><button class="btn sm d" data-a="del" data-id="${l.id}">${ic('trash-2')}Excluir</button></div></div></div>`).join(''):'<p class="mu">Nenhum lead arquivado.</p>'}`;
}
function vCfg(){
  let host='';try{host=new URL(localStorage.p7url||CFG.url).host}catch(e){}
  return`<h1>Configurações</h1><div class="g2"><div class="pn"><h2>Conta</h2><p class="mu">${esc(user&&user.email)}</p><div class="row"><button class="btn d" data-a="out">${ic('log-out')}Sair da conta</button></div></div>
  <div class="pn"><h2>Conexão Supabase</h2><p class="mu">Projeto: ${esc(host||'definido no arquivo')}</p><div class="row"><button class="btn" data-a="resetcfg">Alterar conexão</button></div></div>
  <div class="pn"><h2>Preferências</h2><label class="row"><input type="checkbox" style="width:auto" data-ch="compact" ${localStorage.p7c=='1'?'checked':''}> Visual compacto</label><label class="sm2" style="display:block;margin-top:8px">Tela inicial<select data-ch="dv">${NAV.map(n=>`<option value="${n[0]}" ${st.view==n[0]&&0||localStorage.p7dv==n[0]?'selected':''}>${n[2]}</option>`).join('')}</select></label></div>
  <div class="pn"><h2>Sincronização</h2><p class="mu" style="margin-bottom:8px">Os dados ficam no Supabase e são recarregados ao abrir o app e ao voltar para a aba. Alterações feitas em outro aparelho aparecem após recarregar/sincronizar.</p><button class="btn p" data-a="sync">${ic('rotate-ccw')}Sincronizar agora</button></div></div>`;
}

/* ---------- MODAL / FORM HELPERS ---------- */
function modal(h,w){$('#modal').innerHTML=`<div class="ov" data-a="mclose"><div class="md ${w?'w':''}">${h}</div></div>`;icons()}
const closeM=()=>{$('#modal').innerHTML=''};
const inp=(lb,n,v='',t='text',x='')=>`<label>${lb}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(lb,n,o,v)=>`<label>${lb}<select name="${n}">${o.map(([k,t])=>`<option value="${k}" ${k==v?'selected':''}>${t}</option>`).join('')}</select></label>`;
const typeOpts=Object.entries(AT);
function leadForm(id,stage){
  const l=id?L(id):{stage:stage||'novo',origin_type:'proprio'};
  modal(`<h2>${id?'Editar':'Novo'} lead</h2><form class="fg" data-f="lead" data-id="${id||''}">
  ${inp('Nome do contato *','name',l.name,'text','required')}${inp('Empresa','company',l.company)}${inp('Telefone/WhatsApp','phone',l.phone,'tel','placeholder="(98) 99999-9999"')}${inp('E-mail','email',l.email,'email')}
  ${inp('Profissão/segmento','profession',l.profession)}${inp('Cidade','city',l.city)}${inp('Origem do lead','origin',l.origin)}${sel('Tipo de origem','origin_type',Object.entries(OT),l.origin_type)}
  ${inp('Nome do SDR/parceiro','partner_name',l.partner_name)}${inp('Tags (separe por vírgula)','tags',(l.tags||[]).join(', '))}${sel('Etapa','stage',S,l.stage)}${inp('Valor da proposta (R$)','proposal_value',l.proposal_value||'','number','step="0.01" min="0"')}
  ${inp('Próxima ação','next_action',l.next_action)}${inp('Data/hora da próxima ação','next_action_at',l.next_action_at?loc(l.next_action_at):'','datetime-local')}
  <label class="f">Observações<textarea name="notes" rows="3">${esc(l.notes)}</textarea></label>
  <div class="f row"><button class="btn p" type="submit">Salvar</button><button class="btn" type="button" data-a="mclose">Cancelar</button></div></form>`);
}
function nextFields(){return`${sel('Tipo','type',typeOpts,'followup')}${inp('Quando','at','','datetime-local')}<label class="f">Descrição<input name="content"></label>`}
function schedForm(id){modal(`<h2>Agendar retorno</h2><form class="fg" data-f="sched" data-id="${id}">${nextFields().replace('name="at" type="datetime-local"','name="at" type="datetime-local" required')}<div class="f row"><button class="btn p" type="submit">Agendar</button><button class="btn" type="button" data-a="mclose">Cancelar</button></div></form>`)}
function doneForm(id){modal(`<h2>Concluir atividade</h2><form class="fg" data-f="complete" data-id="${id}"><label class="f">Resultado<textarea name="result" rows="3" placeholder="O que aconteceu?"></textarea></label><div class="f mu">Agendar próxima ação (opcional)</div>${nextFields().replace('name="at"','name="next_at"')}<div class="f row"><button class="btn p" type="submit">Concluir</button><button class="btn" type="button" data-a="mclose">Cancelar</button></div></form>`)}
function prev(m){const r=RULES[m];return`Estúdio R$ 200 · Apresentador R$ 100 · Caixa R$ 600${r.s?' · SDR R$ '+r.s:''}${r.o?' · '+r.ol+' R$ '+r.o:''} → <b class="ac">Minha comissão: ${brl(r.m)}</b> <span class="mu">(prévia; o valor oficial é calculado pelo banco)</span>`}
function saleForm(lid,sid){
  const s=sid?st.sales.find(x=>x.id==sid):{model:'propria',sale_date:today(),payment_status:'pendente'};
  modal(`<h2>${sid?'Editar':'Registrar'} venda</h2><form class="fg" data-f="sale" data-id="${lid}" data-sid="${sid||''}">
  ${sel('Modalidade','model',Object.entries(MD),s.model)}${inp('Valor da venda (R$)','sale_value',s.sale_value||'','number','step="0.01" min="0" required')}
  ${inp('SDR','sdr_name',s.sdr_name)}${inp('Closer / vendedor / parceiro','closer_name',s.closer_name)}${inp('Data da venda','sale_date',s.sale_date,'date','required')}
  ${sel('Recebimento','payment_status',[['pendente','Pendente'],['parcial','Parcial'],['recebido','Recebido']],s.payment_status)}${inp('Valor recebido (R$)','received_value',s.received_value||'','number','step="0.01" min="0"')}${inp('Data do recebimento','received_date',s.received_date,'date')}
  <div class="f" id="prev">${prev(s.model)}</div><div class="f row"><button class="btn p" type="submit">Salvar venda</button><button class="btn" type="button" data-a="mclose">Cancelar</button>${sid?`<button class="btn d" type="button" data-a="delsale" data-id="${sid}" data-l="${lid}">Excluir venda</button>`:''}</div></form>`);
}
function detail(id){
  const l=L(id);if(!l)return;st.open=id;
  const A=st.acts.filter(a=>a.lead_id==id),sales=st.sales.filter(s=>s.lead_id==id);
  modal(`<div class="rw" style="border:0"><div><h2 style="margin:0">${esc(l.name)}</h2><div class="mu">${esc([l.company,l.profession,l.city].filter(Boolean).join(' · '))}</div></div><button class="btn ib" data-a="mclose">${ic('x')}</button></div>
  <div class="row" style="margin-bottom:12px"><button class="btn g" data-a="wa" data-id="${id}">${ic('message-circle')}WhatsApp</button><button class="btn" data-a="edit" data-id="${id}">${ic('pencil')}Editar</button><button class="btn" data-a="sched" data-id="${id}">${ic('clock')}Agendar</button>${l.archived?`<button class="btn g" data-a="restore" data-id="${id}">Restaurar</button>`:`<button class="btn d" data-a="arch" data-id="${id}">${ic('archive')}Arquivar</button>`}</div>
  <label class="sm2">Etapa<select data-ch="stage" data-id="${id}">${S.map(([k,n])=>`<option value="${k}" ${k==l.stage?'selected':''}>${n}</option>`).join('')}</select></label>
  <div class="pn" style="margin:12px 0"><div class="rw"><span class="mu">Telefone</span><span>${esc(l.phone)||'—'}</span></div><div class="rw"><span class="mu">E-mail</span><span>${esc(l.email)||'—'}</span></div><div class="rw"><span class="mu">Origem</span><span>${OT[l.origin_type]}${l.origin?' · '+esc(l.origin):''}${l.partner_name?' · '+esc(l.partner_name):''}</span></div><div class="rw"><span class="mu">Proposta</span><b class="ac">${brl(l.proposal_value)}</b></div><div class="rw"><span class="mu">Próxima ação</span><span>${esc(l.next_action)} ${l.next_action_at?fDT(l.next_action_at):'—'}</span></div><div class="rw"><span class="mu">Tags</span><span>${(l.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join('')||'—'}</span></div>${l.notes?`<p style="margin-top:8px;white-space:pre-wrap">${esc(l.notes)}</p>`:''}</div>
  <h2>Vendas</h2>${sales.map(s=>`<div class="pn" style="margin-bottom:8px"><div class="rw" style="border:0"><b>${MD[s.model]} · ${brl(s.sale_value)}</b><button class="btn sm" data-a="editsale" data-id="${s.id}" data-l="${id}">Editar</button></div><div class="sm2">Venda ${fDay(s.sale_date)} · ${s.payment_status} · recebido ${brl(s.received_value)} ${s.received_date?'em '+fDay(s.received_date):''}</div><div>Minha comissão: <b class="ac">${brl(s.my_commission)}</b></div></div>`).join('')||'<p class="mu" style="margin-bottom:8px">Nenhuma venda registrada.</p>'}
  <button class="btn" data-a="newsale" data-id="${id}" style="margin-bottom:16px">${ic('plus')}Registrar venda</button>
  <h2>Nova atividade</h2><form class="fg" data-f="act" data-id="${id}">${sel('Tipo','type',typeOpts,'mensagem')}${inp('Agendar para (opcional)','at','','datetime-local')}<label class="f">Descrição<input name="content" required></label><div class="f"><button class="btn p" type="submit">Registrar</button></div></form>
  <h2 style="margin-top:16px">Histórico</h2>${A.map(a=>`<div class="rw" style="flex-direction:column;gap:2px"><div class="sm2">${AT[a.type]} · ${fDT(a.done_at||a.created_at)}${a.scheduled_at&&!a.done?' · agendada '+fDT(a.scheduled_at):''}${!a.done?' · pendente':''}</div><div>${esc(a.content)}</div>${a.result?`<div class="mu">Resultado: ${esc(a.result)}</div>`:''}</div>`).join('')||'<p class="mu">Sem atividades.</p>'}`,1);
}

/* ---------- DATA OPS ---------- */
async function addAct(lead_id,o){const at=o.at?new Date(o.at).toISOString():null;return q(sb.from('lead_activities').insert({lead_id,type:o.type||'observacao',content:o.content||'',scheduled_at:at,done:!at,done_at:at?null:new Date().toISOString()}).select().single())}
async function syncNext(id){const p=(await q(sb.from('lead_activities').select('*').eq('lead_id',id).eq('done',false).not('scheduled_at','is',null).order('scheduled_at').limit(1)))[0];await q(sb.from('leads').update({next_action:p?(p.content||AT[p.type]):'',next_action_at:p?p.scheduled_at:null}).eq('id',id))}
async function moveLead(id,stage){
  const l=L(id);if(!l||l.stage==stage)return;
  try{await q(sb.from('leads').update({stage}).eq('id',id));await addAct(id,{type:'observacao',content:'Etapa alterada: '+SN[l.stage]+' → '+SN[stage]});await load();if($('#modal .md'))detail(id);toast('Etapa atualizada')}catch(e){await load()}
}
const forms={
  async setup(d){localStorage.p7url=d.url.trim();localStorage.p7key=d.key.trim();location.reload()},
  async auth(d){const{error}=await sb.auth.signInWithPassword({email:d.email,password:d.password});if(error)return toast(error.message,1);location.reload()},
  async lead(d,ds){
    const p={name:d.name.trim(),company:d.company,phone:d.phone,email:d.email,profession:d.profession,city:d.city,origin:d.origin,origin_type:d.origin_type,partner_name:d.partner_name,tags:d.tags.split(',').map(x=>x.trim()).filter(Boolean),stage:d.stage,proposal_value:Number(d.proposal_value)||0,notes:d.notes};
    const old=ds.id?L(ds.id):null;
    const row=ds.id?await q(sb.from('leads').update(p).eq('id',ds.id).select().single()):await q(sb.from('leads').insert(p).select().single());
    if(d.next_action_at&&(!old||!old.next_action_at||new Date(old.next_action_at).getTime()!=new Date(d.next_action_at).getTime())){await addAct(row.id,{type:'followup',content:d.next_action,at:d.next_action_at});await syncNext(row.id)}
    closeM();await load();toast('Lead salvo')
  },
  async act(d,ds){await addAct(ds.id,d);if(d.at)await syncNext(ds.id);await load();detail(ds.id);toast('Atividade registrada')},
  async sched(d,ds){await addAct(ds.id,d);await syncNext(ds.id);closeM();await load();toast('Retorno agendado')},
  async complete(d,ds){
    const a=st.acts.find(x=>x.id==ds.id);
    await q(sb.from('lead_activities').update({done:true,done_at:new Date().toISOString(),result:d.result}).eq('id',ds.id));
    if(d.next_at)await addAct(a.lead_id,{type:d.type,content:d.content,at:d.next_at});
    await syncNext(a.lead_id);closeM();await load();toast('Atividade concluída')
  },
  async sale(d,ds){
    const p={lead_id:ds.id,model:d.model,sale_value:Number(d.sale_value)||0,sdr_name:d.sdr_name,closer_name:d.closer_name,sale_date:d.sale_date,payment_status:d.payment_status,received_value:Number(d.received_value)||0,received_date:d.received_date||null};
    if(ds.sid)await q(sb.from('sales').update(p).eq('id',ds.sid));else await q(sb.from('sales').insert(p));
    await load();detail(ds.id);toast('Venda salva')
  }
};
const A={
  nav(t){st.view=t.v;closeM();render();scrollTo(0,0)},
  ag(t){st.ag=t.v;render()},kf(t){st.kf=t.v;render()},
  newLead(t){leadForm(null,t.s)},open(t){$('#sr').hidden=true;$('#q').value='';detail(t.id)},edit(t){leadForm(t.id)},
  wa(t){wa(t.id)},sched(t){schedForm(t.id)},done(t){doneForm(t.id)},newsale(t){saleForm(t.id)},editsale(t){saleForm(t.l,t.id)},
  mclose(t,e){if(e.target===t||t.tagName=='BUTTON')closeM()},
  async arch(t){await q(sb.from('leads').update({archived:true,archived_at:new Date().toISOString()}).eq('id',t.id));closeM();await load();toast('Lead arquivado')},
  async restore(t){await q(sb.from('leads').update({archived:false,archived_at:null}).eq('id',t.id));closeM();await load();toast('Lead restaurado')},
  async del(t){if(!confirm('Excluir definitivamente este lead, seu histórico e suas vendas? Não pode ser desfeito.'))return;await q(sb.from('leads').delete().eq('id',t.id));closeM();await load();toast('Lead excluído')},
  async delsale(t){if(!confirm('Excluir esta venda?'))return;await q(sb.from('sales').delete().eq('id',t.id));await load();detail(t.l)},
  async signup(){const f=document.querySelector('[data-f=auth]'),d=Object.fromEntries(new FormData(f));if(!d.email||!d.password)return toast('Preencha e-mail e senha.',1);const{data,error}=await sb.auth.signUp({email:d.email,password:d.password});if(error)return toast(error.message,1);if(data.session)location.reload();else toast('Conta criada. Confirme o e-mail (se exigido) e entre.')},
  async out(){if(confirm('Sair da conta?')){await sb.auth.signOut();location.reload()}},
  resetcfg(){if(confirm('Remover a conexão salva neste navegador?')){localStorage.removeItem('p7url');localStorage.removeItem('p7key');location.reload()}},
  async sync(){await boot();toast('Sincronizado')}
};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;try{await A[t.dataset.a]?.(t.dataset,e)}catch(x){console.error(x)}
  if(!e.target.closest('.sb'))$('#sr')&&($('#sr').hidden=true)});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=f.querySelector('[type=submit]');if(b)b.disabled=true;try{await forms[f.dataset.f](Object.fromEntries(new FormData(f)),f.dataset)}catch(x){console.error(x)}finally{if(b)b.disabled=false}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.ch;
  if(c=='stage')moveLead(t.dataset.id,t.value);
  if(c=='compact'){localStorage.p7c=t.checked?'1':'0';document.body.classList.toggle('cp',t.checked)}
  if(c=='dv')localStorage.p7dv=t.value;
  if(t.name=='model'&&$('#prev'))$('#prev').innerHTML=prev(t.value)});
document.addEventListener('input',e=>{if(e.target.id!='q')return;const v=e.target.value.toLowerCase().trim(),r=$('#sr');if(!v){r.hidden=true;return}
  const m=st.leads.filter(l=>[l.name,l.company,l.city,l.profession,(l.tags||[]).join(' ')].join(' ').toLowerCase().includes(v)).slice(0,8);
  r.innerHTML=m.map(l=>`<div data-a="open" data-id="${l.id}"><b>${esc(l.name)}</b> <span class="mu">${esc(l.company)} ${l.archived?'(arquivado)':'· '+SN[l.stage]}</span></div>`).join('')||'<div class="mu">Nada encontrado</div>';r.hidden=false});
/* Drag and drop (desktop) */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){dragId=c.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c&&dragId){e.preventDefault();document.querySelectorAll('.col').forEach(x=>x.classList.toggle('ov2',x===c))}});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');document.querySelectorAll('.col').forEach(x=>x.classList.remove('ov2'));if(c&&dragId){e.preventDefault();moveLead(dragId,c.dataset.col)}dragId=null});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col').forEach(x=>x.classList.remove('ov2'))});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sb&&user&&!$('#modal .md'))load().catch(()=>{})});
init();
</script></body></html>
